name: Docs site

# Builds the docs site in docs/ with smalldocs on each pull request. On a push to main, it also publishes the site
# to GitHub Pages at https://rahuldave.com/cx/. Pages must use "GitHub Actions" as its source, the build type workflow.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Install jlog
        # The index of jnterfaces sets jlog as the shell of each recipe, so the job needs jlog for just docs-build. The
        # tag v0.3.0 of jlog is the commit d4b712b, as in the CI of jnterfaces. install.sh downloads the release
        # binary, checks its SHA-256 and puts it in ~/.local/bin. The step shell bash has pipefail, so a failed
        # download fails.
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/rahuldave/jlog/v0.3.0/scripts/install.sh | sh -s -- --tag v0.3.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the site in strict mode
        run: just docs-build
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    name: Publish the docs site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # One publish at a time. A later publish waits for the one before it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v5
